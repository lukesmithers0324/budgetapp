<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget</title>
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="g-ok" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2cf58c"/><stop offset="1" stop-color="#00bbf9"/></linearGradient>
<linearGradient id="g-over" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa62b"/><stop offset=".5" stop-color="#f72585"/><stop offset="1" stop-color="#6d3bff"/></linearGradient>
<linearGradient id="g-spent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9b5de5"/><stop offset="1" stop-color="#00bbf9"/></linearGradient>
</defs></svg>
<aside class="side">
  <div class="logo"><i></i>Budget</div>
  <nav><a href="#overview" class="on">Overview</a><a href="#budgets">Budgets</a><a href="#transactions">Transactions</a></nav>
  <button id="connect">Connect a bank</button><button id="recat">Auto-categorize</button><button id="logout">Log out</button><button id="sync">Sync now</button>
</aside>
<main>
  <header id="overview"><span class="crumb">Dashboard / Overview</span>
    <div class="mo"><button id="prev" aria-label="Previous month">&lsaquo;</button><input type="month" id="month" aria-label="Month"><button id="next" aria-label="Next month">&rsaquo;</button></div>
  </header>
  <p id="status" role="status"></p>
  <section id="stats" class="stats"></section>
  <section class="row r1">
    <figure class="card"><figcaption>Spending pace</figcaption><svg id="pace" role="img" aria-label="Cumulative spending by day"></svg>
      <span class="key" style="--c:var(--spent)">Spent so far</span><span class="key" style="--c:var(--over)">Total budget</span></figure>
    <figure class="card"><figcaption>Category breakdown</figcaption><div class="donutwrap"><svg id="donut" role="img" aria-label="Spending by category"></svg><ul id="legend" class="legend"></ul></div></figure>
  </section>
  <section class="row">
    <div class="card"><h2>Health</h2><div id="rings" class="rings"></div></div>
    <figure class="card"><figcaption>Last 6 months</figcaption><svg id="trend" role="img" aria-label="Income and spending by month"></svg>
      <span class="key" style="--c:var(--ok)">Income</span><span class="key" style="--c:var(--spent)">Spent</span></figure>
  </section>
  <section id="budgets" class="card"><h2>Budgets</h2><div id="cats"></div></section>
  <section id="transactions" class="card"><h2>Recent transactions</h2>
    <div class="filters"><input id="q" type="search" placeholder="Search merchants" aria-label="Search merchants"><select id="cf" aria-label="Filter by category"></select><span id="count"></span></div>
    <div class="wrap"><table><tbody id="txns"></tbody></table></div>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
