<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Budget login</title>
<style>:root{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#120e24;color:#f1ecff;font:16px/1.5 system-ui,sans-serif}
form{width:min(22rem,90vw);background:#1d1738;border-radius:18px;padding:1.5rem;display:grid;gap:.8rem}h1{margin:0 0 .3rem;font-size:1.3rem}
input,button{font:inherit;color:inherit;background:#120e24;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:.55rem .7rem}
button{background:linear-gradient(135deg,#9b5de5,#00bbf9);border:0;font-weight:600;cursor:pointer}#err{color:#ff4d8d;min-height:1.4rem;margin:0}</style></head>
<body><form id="f"><h1>Budget</h1>
<input id="pw" type="password" placeholder="Passphrase" autocomplete="current-password" required>
<input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code" required>
<p id="err" role="alert"></p><button>Log in</button></form>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const r = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json', 'X-Budget': '1'}, body: JSON.stringify({password: pw.value, code: code.value})});
  if (r.ok) { const n = new URLSearchParams(location.search).get('next'); location.href = n && n[0] === '/' && n[1] !== '/' ? n : '/'; }
  else document.getElementById('err').textContent = (await r.json().catch(() => ({}))).error || 'Login failed.';
};
</script></body></html>
